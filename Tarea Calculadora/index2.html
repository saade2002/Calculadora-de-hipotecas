<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarea de calculadora</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/assets/main.css">

</head>

<body>

<div class="container d-flex justify-content-center">
    <div class="calculator-card">
        <div  id="formulario" class="row g-0">
            <div class="col-md-6 form-section">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h4 class="form-title m-0">Calculadora Hipotecaria</h4>
                    <span class="btn btn-light">Borrar Datos</span>
                </div>

                    <form id="hipoteca">
                    <div class="mb-3">
                        <label  class="form-label text-secondary small fw-bold" for="total">Valor de la Hipoteca</label>
                        <div  class="input-group">
                            <span class="input-group-text">$</span>
                            <input  id="total" input type="number"  class="form-control" placeholder="Total">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-6 mb-3">
                            <label class="form-label text-secondary small fw-bold" for="plazo">Termino de la Hipoteca</label>
                            <div   class="input-group">
                                <input id="plazo" type="number"  class="form-control" placeholder="Años">
                                <span class="input-group-text">Años</span>
                            </div>
                        </div>
                        <div class="col-6 mb-3">
                            <label class="form-label text-secondary small fw-bold" for="interes" >Interes</label>
                            <div  class="input-group">
                                <input id="interes"  type="number" class="form-control" placeholder="Intereses Anuales">
                                <span class="input-group-text">%</span>
                            </div>
                        </div>
                    </div>
                   
                    
                <select id="tipo">
                    <option value="1">Amortización completa</option>
                    <option value="2">Solo interés</option>
                </select>



                    <button id="calcular" type="submit" class="btn btn-light"">
                        <i class="bi bi-calculator-fill"></i> Calcular 
                    </button>
                </form>
            </div>
 </form>
            <div class="col-md-6 results-section">
                <div class="mt-4">
                    <img src="https://ayuda.baccredomatic.com/themes/custom/bac_cda_theme/logo.svg" 
                         alt="BAC Credomatic Logo" 
                         class="calculator-logo">
                </div>
                <h3 ></h3>
                <h3 id=" results" >Los resultados se mostraran aqui</h3>
                <p id="result-mens"></p>
        <p id="result-total"></p>
                <p>LLene los datos par poder calcular cuales seran sus cuotas mensuales.</p>
            </div>
        </div>
    </div>
</div>
<script src="./calculadora.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
